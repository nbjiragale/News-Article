name: android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assemble + unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build reads API keys from local.properties. CI has none and must not
      # have any: the keys are only needed at runtime, and an empty value still
      # produces a valid BuildConfig field, so compilation is unaffected.
      - name: Create empty local.properties
        run: touch local.properties

      # Defensive: gradlew was committed as mode 100644 and is restored to 100755
      # in this commit. Re-adding it from a Windows checkout can drop the bit again,
      # which fails the build with a bare "Permission denied" (exit 126).
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        # RUN_LIVE_YOUTUBE_TESTS is deliberately unset so the network-dependent
        # YouTube test stays skipped on CI.
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      # R8 only runs on release builds, so a debug-only pipeline cannot tell us
      # whether minification breaks the app. No keystore is configured on CI, so
      # this produces an unsigned APK -- which is all we need to exercise
      # shrinking, obfuscation and resource shrinking.
      - name: Assemble release (exercises R8)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
